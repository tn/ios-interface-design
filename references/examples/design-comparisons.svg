<text x="712" y="1215" font-size="17" font-weight="400" fill="#52606b" text-anchor="start">Baseline and trailing alignment support comparison.</text>
<text x="40" y="1290" font-size="23" font-weight="700" fill="#192128" text-anchor="start">03  Stable anchors make values easier to compare</text>
<text x="40" y="1324" font-size="17" font-weight="400" fill="#52606b" text-anchor="start">Guides explain alignment. Example colors and measurements are not a required theme.</text>
</g></svg>