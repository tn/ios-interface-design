<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1350" viewBox="0 0 1320 1350" role="img" aria-labelledby="title desc">
<title id="title">Three controlled design comparisons</title>
<desc id="desc">Before and after diagrams preserve content while changing proximity, visual hierarchy, and baseline alignment. These are schematic examples, not app screenshots.</desc>
<rect width="1320" height="1350" fill="#f3f5f6"/>
