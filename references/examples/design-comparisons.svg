<text x="712" y="322" font-size="18" font-weight="400" fill="#52606b" text-anchor="start">Yesterday, 19:10</text>
<text x="72" y="381" font-size="17" font-weight="400" fill="#52606b" text-anchor="start">Equal gaps obscure the two groups.</text>
<text x="712" y="381" font-size="17" font-weight="400" fill="#52606b" text-anchor="start">Smaller internal gaps connect each title and time.</text>
