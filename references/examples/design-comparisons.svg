<text x="40" y="78" font-size="18" font-weight="400" fill="#52606b" text-anchor="start">Schematic comparisons. The content stays the same within each pair.</text>
<text x="40" y="115" font-size="14" font-weight="700" fill="#52606b" text-anchor="start">BEFORE</text>
<text x="680" y="115" font-size="14" font-weight="700" fill="#166b56" text-anchor="start">AFTER</text>
